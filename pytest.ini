[pytest]
# TEST-COL-1: Bound repo-wide pytest collection sweep to tests/ directory.
# Recovering tools/ and systems/ is deferred to a declared follow-on leg requiring
# a per-file timeout harness because collection across them does not terminate.
# Three measured non-terminating files outside the declared sweep:
#   - systems/infinite_map_rs/test_daemon.py (module-level server.accept() blocks indefinitely)
#   - tools/boot_alpine_opensbi_test.py (top-level @numba.njit JIT compilation hang)
#   - tools/test_setup_vm.py (>=60 s, undiagnosed collection hang)
pythonpath = .
testpaths = tests
markers =
    live_smoke: non-blocking live model probe excluded from deterministic arc runs

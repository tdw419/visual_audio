[package]
name = "geos_pixel_v5"
version = "0.1.0"
edition = "2021"

[features]
default = ["std"]
std = ["dep:image", "dep:sha2", "dep:rusqlite", "dep:serde_json", "dep:serde"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "std"]
evdev = ["dep:evdev", "dep:libc", "std"]
glyph = ["std"]

[dependencies]
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
image = { version = "0.25.10", optional = true }
sha2 = { version = "0.10", optional = true }
rusqlite = { version = "0.31.0", optional = true }
wgpu = { version = "0.20", optional = true, features = ["spirv"] }
bytemuck = { version = "1", optional = true, features = ["derive"] }
pollster = { version = "0.3", optional = true }
serde_json = { version = "1.0", optional = true }
serde = { version = "1.0", optional = true, features = ["derive"] }
minifb = "0.28.0"
drm = "0.15.0"
evdev = { version = "0.12", optional = true }
libc = { version = "0.2", optional = true }

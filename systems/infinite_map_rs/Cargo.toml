[package]
name = "infinite_map_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = { version = "0.29", features = ["rwh_05"] }
wgpu = "0.19"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.3"
portable-pty = "0.8"
vt100 = "0.15"
glyphon = "0.5" # Text renderer for WGPU
env_logger = "0.11"
log = "0.4"
strip-ansi-escapes = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pulldown-cmark = "0.13.4"
image = "0.25.10"

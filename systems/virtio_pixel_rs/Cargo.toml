[package]
name = "virtio_pixel_rs"
version = "0.1.0"
edition = "2021"
authors = ["Jericho <tdw419@github.com>"]
description = "VirtIO Pixel vhost-user-blk backend with spatial MKV storage and WGPU Hilbert decoding"

[lib]
name = "virtio_pixel_rs"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "virtio_pixel_backend"
path = "src/main.rs"

[[example]]
name = "benchmark_hilbert_compute"
path = "examples/benchmark_hilbert_compute.rs"

[dependencies]
# vhost-user-backend: Official rust-vmm vhost-user implementation
vhost-user-backend = "0.13"
vhost = { version = "0.11", features = ["vhost-user-backend"] }
virtio-queue = "0.12"
vm-memory = "0.14"

# WGPU for Hilbert pixel decoding
wgpu = "0.20"
pollster = "0.3"  # Async runtime for WGPU

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Utilities
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
memmap2 = "0.9"
nix = { version = "0.28", features = ["socket", "uio", "fs"] }  # FD passing, recvmsg for SET_MEM_TABLE

# Image loading for MKV frame extraction
image = "0.24"

# Byte-level buffer casting
bytemuck = { version = "1.14", features = ["derive"] }

# Temporary file handling for MKV frame extraction
tempfile = "3.8"

# PXC1 container format (docs/PIXEL_CONTAINER_SPEC_V1.md) - replaces the
# ffmpeg/.nut path, which had a real pixel-format mismatch bug (BGR write
# order vs declared rgb24 stream) that silently corrupted containers.
pxc1 = { path = "../../tools/pxc1" }

# COW journal dependencies for PXC1 write optimization
flate2 = "1.0"
zstd = "0.13"  # Better compression than ZLIB (~18% on filesystem data)
crc32fast = "1.3"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
sha2 = "0.10"  # For computing base container hash
hex = "0.4"

# FFmpeg for hardware video decoding (Phase 5 - optional)
# ffmpeg-sys-next = "7.0"

# LRU cache for predictive pre-fetching (Phase 5)
lru = "0.12"

# Thread-safe channels for background prefetch (Phase 5)
crossbeam-channel = "0.5"
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.8"
sha2 = "0.10"
hex = "0.4"

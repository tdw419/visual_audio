<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry OS Visual Shell</title>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background: radial-gradient(circle at center, #1a1a2e 0%, #050508 100%); 
            color: #00ff00; font-family: monospace; 
            display: flex;
            height: 100vh;
        }
        #neural-ascii {
            width: 40%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            border-right: 2px solid rgba(0, 255, 0, 0.3);
            overflow-y: auto;
            text-shadow: 0 0 5px #00ff00;
        }
        #reality-gui {
            width: 60%;
            height: 100%;
            position: relative;
        }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; top: 15px; left: 15px; z-index: 2; pointer-events: none; }
        .glass-panel {
            background: rgba(26, 26, 46, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 255, 0.3); /* neon-blue accents */
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,255,255,0.1);
        }
        h2 { margin-top: 0; color: #00ffff; text-shadow: 0 0 10px rgba(0,255,255,0.5); }
    </style>
    <!-- Use PixiJS v8 -->
    <script src="https://pixijs.download/v8.0.0/pixi.min.js"></script>
</head>
<body>
    <div id="neural-ascii">
        <h3>[ GLYPH STRATUM ]</h3>
        <pre id="glyph-log">Initializing Spatial Assembly...</pre>
        <div id="registers" style="margin-top: 20px;"></div>
    </div>
    <div id="reality-gui">
        <div id="ui-layer">
            <div class="glass-panel">
                <h2>Geometry OS</h2>
                <p id="status">Connecting pxOS Substrate...</p>
                <p>Spatial Target: window_coordinator.rts.png</p>
            </div>
        </div>
        <div id="canvas-container"></div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
